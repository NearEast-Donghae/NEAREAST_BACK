[build-system]
requires = ["setuptools>=75.1,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "neareast-backend"
version = "0.1.0"
description = "Minimal, modular FastAPI foundation for NearEast"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "psycopg2-binary>=2.9.11,<3",
    "SQLAlchemy>=2.0.46,<2.1",
    "alembic>=1.18,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neareast_api*"]
