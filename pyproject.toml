[build-system]
requires = ["setuptools>=75.1,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "neareast-backend"
version = "0.1.0"
description = "Minimal, modular FastAPI foundation for NearEast"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6,<1",
    "starlette>=0.44,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "psycopg2-binary>=2.9.11,<3",
    "SQLAlchemy>=2.0.46,<2.1",
    "alembic>=1.18,<2",
    "openai>=2.0,<3",
    "argon2-cffi>=23.1,<26",
    "pgvector>=0.3.6,<1",
    "tzdata>=2024.1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "ruff>=0.9,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neareast_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
