services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${NEAREAST_HTTP_PORT:-8012}:8000"
    environment:
      NEAREAST_SESSION_COOKIE_NAME: "${NEAREAST_SESSION_COOKIE_NAME:-neareast_session}"
      NEAREAST_SESSION_LIFETIME_HOURS: "${NEAREAST_SESSION_LIFETIME_HOURS:-168}"
      NEAREAST_COOKIE_SECURE: "${NEAREAST_COOKIE_SECURE:-false}"
      NEAREAST_DOCS_ENABLED: "${NEAREAST_DOCS_ENABLED:-true}"
      NEAREAST_CORS_ALLOW_ORIGINS: "${NEAREAST_CORS_ALLOW_ORIGINS:-}"
      NEAREAST_CHAT_MOCK: "${NEAREAST_CHAT_MOCK:-true}"
      NEAREAST_CHAT_RATE_LIMIT_PER_MINUTE: "${NEAREAST_CHAT_RATE_LIMIT_PER_MINUTE:-60}"
      NEAREAST_OPENAI_API_KEY: "${NEAREAST_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}"
      NEAREAST_CHAT_MODEL: "${NEAREAST_CHAT_MODEL:-gpt-5.4-nano}"
      NEAREAST_TMAP_API_KEY: "${NEAREAST_TMAP_API_KEY:-${TMAP_API_KEY:-}}"
      NEAREAST_EMBEDDING_MODEL: "${NEAREAST_EMBEDDING_MODEL:-text-embedding-3-large}"
      NEAREAST_CHAT_VECTOR_SEARCH: "${NEAREAST_CHAT_VECTOR_SEARCH:-true}"
      NEAREAST_VECTOR_MIN_SIMILARITY: "${NEAREAST_VECTOR_MIN_SIMILARITY:-0.27}"
      NEAREAST_EMBEDDING_TIMEOUT_SECONDS: "${NEAREAST_EMBEDDING_TIMEOUT_SECONDS:-2}"
      NEAREAST_CHAT_MAX_TOKENS: "${NEAREAST_CHAT_MAX_TOKENS:-1000}"
      NEAREAST_LLM_TIMEOUT_SECONDS: "${NEAREAST_LLM_TIMEOUT_SECONDS:-8}"
      NEAREAST_CHAT_DEADLINE_SECONDS: "${NEAREAST_CHAT_DEADLINE_SECONDS:-12}"
      NEAREAST_CHAT_AGENT: "${NEAREAST_CHAT_AGENT:-false}"
      NEAREAST_CHAT_AGENT_MAX_STEPS: "${NEAREAST_CHAT_AGENT_MAX_STEPS:-4}"
      # Not passed on purpose: NEAREAST_CONTENT_DIR (deprecated after PostgreSQL migration) and
      # NEAREAST_CHAT_REASONING_EFFORT (an empty value is invalid; set it here if needed).
      # Container-to-container traffic uses the service name and internal port.
      NEAREAST_DB_HOST: db
      NEAREAST_DB_PORT: "5432"
      NEAREAST_DB_NAME: "${NEAREAST_DB_NAME:?Create .env from .env.example}"
      NEAREAST_DB_USER: "${NEAREAST_DB_USER:?Create .env from .env.example}"
      NEAREAST_DB_PASSWORD: "${NEAREAST_DB_PASSWORD:?Set NEAREAST_DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=7).close()"]
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3

  migrate:
    build: .
    command: ["python", "scripts/migrate.py"]
    environment:
      NEAREAST_DB_HOST: db
      NEAREAST_DB_PORT: "5432"
      NEAREAST_DB_NAME: "${NEAREAST_DB_NAME:?Create .env from .env.example}"
      NEAREAST_DB_USER: "${NEAREAST_DB_USER:?Create .env from .env.example}"
      NEAREAST_DB_PASSWORD: "${NEAREAST_DB_PASSWORD:?Set NEAREAST_DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: "${NEAREAST_DB_NAME:?Create .env from .env.example}"
      POSTGRES_USER: "${NEAREAST_DB_USER:?Create .env from .env.example}"
      POSTGRES_PASSWORD: "${NEAREAST_DB_PASSWORD:?Set NEAREAST_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${NEAREAST_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  postgres_data:
