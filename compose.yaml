services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${NEAREAST_HTTP_PORT:-8012}:8000"
    environment:
      NEAREAST_DOCS_ENABLED: "${NEAREAST_DOCS_ENABLED:-true}"
      NEAREAST_CORS_ALLOW_ORIGINS: "${NEAREAST_CORS_ALLOW_ORIGINS:-}"
      NEAREAST_CHAT_MOCK: "${NEAREAST_CHAT_MOCK:-true}"
      NEAREAST_OPENAI_API_KEY: "${NEAREAST_OPENAI_API_KEY:-}"
      NEAREAST_CHAT_MODEL: "${NEAREAST_CHAT_MODEL:-gpt-5.4-nano}"
      NEAREAST_EMBEDDING_MODEL: "${NEAREAST_EMBEDDING_MODEL:-text-embedding-3-small}"
      # The app user cannot write /app; keep the usage record in a writable place.
      NEAREAST_LLM_USAGE_LOG: /tmp/llm_usage.jsonl
      # Container-to-container traffic uses the service name and internal port.
      NEAREAST_DB_HOST: db
      NEAREAST_DB_PORT: "5432"
      NEAREAST_DB_NAME: "${NEAREAST_DB_NAME:?Create .env from .env.example}"
      NEAREAST_DB_USER: "${NEAREAST_DB_USER:?Create .env from .env.example}"
      NEAREAST_DB_PASSWORD: "${NEAREAST_DB_PASSWORD:?Set NEAREAST_DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=7).close()"]
      interval: 10s
      timeout: 8s
      start_period: 10s
      retries: 3

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${NEAREAST_DB_NAME:?Create .env from .env.example}"
      POSTGRES_USER: "${NEAREAST_DB_USER:?Create .env from .env.example}"
      POSTGRES_PASSWORD: "${NEAREAST_DB_PASSWORD:?Set NEAREAST_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${NEAREAST_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  postgres_data:
